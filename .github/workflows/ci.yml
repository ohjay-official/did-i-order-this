name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the secrets scan covers every commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Tests, core coverage gate, typecheck, lint, Prompt API guard, build,
      # extension zip, secrets scan (files + history), bundle scan, npm audit.
      # Live-site checks run locally with `npm run verify` after a deploy.
      - run: npm run verify -- --offline
