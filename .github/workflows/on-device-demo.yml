name: on-device-demo

# Manual only. Private-repo minutes count against the plan, so this does not run on push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-on-device:
    name: Live site and extension on-device
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Machine facts
        run: |
          echo "cpus: $(nproc)"; free -h; df -h / /mnt || true
          google-chrome --version

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / /mnt || true

      - name: Pick profile volume
        run: |
          if sudo mkdir -p /mnt/nano && sudo chown "$USER" /mnt/nano; then
            echo "PROFILE_DIR=/mnt/nano/profile" >> "$GITHUB_ENV"
          else
            echo "PROFILE_DIR=$RUNNER_TEMP/nano-profile" >> "$GITHUB_ENV"
          fi

      - name: Install ffmpeg and xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg xvfb >/dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install app deps and build the extension
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          npm ci
          npm run build --workspace=@did-i-order-this/extension
          node -e "const fs=require('fs'); const p='extension/dist/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.host_permissions=['https://mail.google.com/*','http://127.0.0.1:8123/*']; m.content_scripts[0].matches=['https://mail.google.com/*','http://127.0.0.1:8123/*']; fs.writeFileSync(p, JSON.stringify(m,null,2));"

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Run on-device demo
        working-directory: e2e
        env:
          SITE_URL: https://did-i-order-this.vercel.app/
          EXTENSION_DIR: ${{ github.workspace }}/extension/dist
          PROBE_TIMEOUT_MIN: "15"
        run: bash run-ci.sh

      - name: Summary
        if: always()
        working-directory: e2e
        run: |
          {
            echo '## On-device demo'
            echo '```json'
            node -e "const d=require('./out/result.json'); const pick=x=>({label:x&&x.label,outcome:x&&x.outcome,headline:x&&x.headline,consentShown:x&&x.consentShown,usedSample:x&&x.usedSample}); console.log(JSON.stringify({chrome:d.version&&d.version.Browser,warmup:d.warmup||null,hostedAvailability:d.hostedAvailability||null,hosted:pick(d.hosted),extensionAvailability:d.extensionAvailability||null,extension:pick(d.extension),fatal:d.fatal||null},null,2))" || echo 'no result.json'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: on-device-demo-out
          path: e2e/out
          retention-days: 14
          if-no-files-found: warn
