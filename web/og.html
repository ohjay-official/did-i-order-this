<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=1200" />
    <title>Open graph image</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f1f0eb; }
      .og { position: relative; width: 1200px; height: 630px; padding: 56px 64px; box-sizing: border-box; }
      .og-stage {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(56% 48% at 70% 80%, rgba(180, 164, 140, 0.32), transparent 70%);
      }
      .og-copy { position: relative; z-index: 1; max-width: 900px; }
      .og-mark {
        margin: 0 0 36px;
        font-family: Syne, sans-serif;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: -0.03em;
        color: #141312;
      }
      .og-copy h1 {
        margin: 0 0 28px;
        font-family: Syne, sans-serif;
        font-weight: 400;
        font-size: 58px;
        line-height: 1.02;
        letter-spacing: -0.045em;
        color: #141312;
        max-width: 14ch;
      }
      .og-verdict {
        display: inline-block;
        padding: 16px 20px;
        background: #f0e2de;
        color: #8b2a22;
        border-radius: 8px;
      }
      .og-verdict .headline {
        margin: 8px 0 0;
        font-family: Syne, sans-serif;
        font-size: 24px;
        font-weight: 500;
        letter-spacing: -0.03em;
        line-height: 1.15;
      }
    </style>
  </head>
  <body>
    <div class="og">
      <div class="og-stage" aria-hidden="true"></div>
      <div class="og-copy">
        <p class="og-mark">Did I Order This?</p>
        <h1>A fake DHL desk<br>just asked for a release fee</h1>
        <div class="og-verdict">
          <p class="source-label">Checked on this device</p>
          <p class="headline">You're not expecting any parcel right now.</p>
        </div>
      </div>
    </div>
  </body>
</html>
