<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Did I Order This?</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        color: #1b1916;
        background: #f3f1eb;
      }
      body { margin: 16px; }
      h1 { font-size: 1.3rem; margin: 0 0 8px; font-family: "Iowan Old Style", Palatino, serif; }
      p, li { font-size: 0.95rem; }
      .lede { color: #5c564c; margin: 0 0 16px; }
      .btn {
        font: inherit;
        border: 1px solid #1b1916;
        border-radius: 2px;
        padding: 8px 12px;
        cursor: pointer;
        background: #1b1916;
        color: #fff;
      }
      .btn-secondary { background: transparent; color: #1b1916; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
      .email, .result { background: #fffdf8; border: 1px solid #cfc8ba; padding: 12px; margin-bottom: 12px; }
      .email-body { white-space: pre-wrap; font: inherit; }
      .source-label { color: #5c564c; }
      .result-warning { background: #f6e6e2; }
      .result-safe { background: #e8f0e8; }
      .result-neutral, .result-limited { background: #eeeae2; }
      .note { color: #5c564c; }
      a { color: #1b1916; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/sidepanel.ts"></script>
  </body>
</html>
